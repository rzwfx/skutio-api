# /etc/nginx/sites-available/n8n.skutio.app — n8n în spatele Nginx, cu HTTPS.
# Blocul SSL îl adaugă `certbot --nginx -d n8n.skutio.app`.

server {
    listen 80;
    listen [::]:80;
    server_name n8n.skutio.app;

    server_tokens off;
    client_max_body_size 16m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # Setup inițial: doar IP-ul administratorului poate deschide n8n până își creează contul
    # de owner (altfel primul vizitator ar putea „revendica" instanța). Scos după setup.
    # include /etc/nginx/snippets/n8n-setup-allowlist.conf;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;   # fluxurile cu AI pot dura

    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"rate_limited"}\n';
    }

    # Login: limită strictă contra ghicirii parolei.
    location = /rest/login {
        limit_req zone=n8n_login burst=3 nodelay;
        proxy_pass http://127.0.0.1:5678;
    }

    # Webhook-uri publice (declanșatoarele fluxurilor).
    location /webhook/ {
        limit_req zone=n8n_webhook burst=5 nodelay;
        proxy_pass http://127.0.0.1:5678;
    }

    # Editorul: WebSocket pentru actualizări în timp real (/rest/push).
    # ATENȚIE: un proxy_set_header într-un location anulează TOATE cele moștenite de la server,
    # deci le repetăm. Fără Host corect, n8n respinge WebSocket-ul („Origin header does NOT match").
    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_pass http://127.0.0.1:5678;
    }
}
