# /etc/nginx/conf.d/skutio-ratelimit.conf — zonele de rate limiting (context http).
# Contor per IP; peste limită Nginx răspunde 429 fără să mai ajungă la Node.
#   skutio_api  — endpoint-urile AI (cost real per cerere)
#   skutio_demo — demo-ul public (are cache, dar limităm oricum)
#   skutio_site — pagina de prezentare, /health, fișiere statice
limit_req_zone $binary_remote_addr zone=skutio_api:10m  rate=20r/m;
limit_req_zone $binary_remote_addr zone=skutio_demo:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=skutio_site:10m rate=10r/s;
limit_req_status 429;
