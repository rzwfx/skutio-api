# /etc/nginx/sites-available/api.skutio.app — „recepția": HTTPS, rate limiting și
# headere de securitate, apoi trimite cererea la Node pe 127.0.0.1:3000.
# Liniile „managed by Certbot" au fost generate de `certbot --nginx` (vezi README).
# Necesită zonele din deploy/nginx-ratelimit.conf.

server {
    server_name api.skutio.app;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.skutio.app/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.skutio.app/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    # Nu anunțăm versiunea Nginx în headere și pagini de eroare.
    server_tokens off;

    # Headere de securitate (CSP și nosniff le setează aplicația).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # analyze acceptă screenshot-uri base64 (~7 MB)
    client_max_body_size 10m;

    # Setări comune de proxy, moștenite de toate location-urile.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;   # Claude poate răspunde în 20-30 s la imagini

    # Peste limită: răspuns JSON, în același format ca restul API-ului.
    error_page 429 = @rate_limited;
    location @rate_limited {
        default_type application/json;
        return 429 '{"error":"rate_limited"}\n';
    }

    location /api/ {
        limit_req zone=skutio_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location = /demo {
        limit_req zone=skutio_demo burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    location / {
        limit_req zone=skutio_site burst=40 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
}

server {
    if ($host = api.skutio.app) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name api.skutio.app;
    return 404; # managed by Certbot
}
