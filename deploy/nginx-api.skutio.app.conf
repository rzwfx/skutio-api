# /etc/nginx/sites-available/api.skutio.app — „recepția": primește traficul din
# internet și îl trimite la Node pe 127.0.0.1:3000. Blocul HTTPS (ssl_certificate…)
# îl adaugă automat certbot la pasul SSL.
server {
    listen 80;
    listen [::]:80;
    server_name api.skutio.app;

    # analyze acceptă screenshot-uri base64 (~7 MB)
    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Claude poate răspunde în 20-30 s la imagini
        proxy_read_timeout 60s;
    }
}
