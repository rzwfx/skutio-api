# Rulează testele la fiecare push pe main și la fiecare pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verificare sintaxă
        run: for f in server.js api/*.js lib/*.js public/app.js; do node --check "$f"; done
      - name: Teste
        run: npm test
